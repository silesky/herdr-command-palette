[package]
name = "herdr-palette"
version = "0.2.0"
edition = "2021"
description = "Fuzzy command palette for Herdr"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
